# CI — Dream Motif Interpreter
# Runs on every push and pull request.
# All steps are required to pass before a PR may be merged.

name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Install ──────────────────────────────────────────────────────────────
  # Install all declared production and dev dependencies.
  install:
    name: Install dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.lock

      - name: Install dependencies
        run: |
          python -m pip install --require-hashes -r requirements-dev.lock
          python -m pip install --no-deps -e .
          python -m pip check

      - name: Verify dependency locks are current
        run: |
          uv lock --check
          uv export --frozen --no-dev --no-emit-project --no-annotate \
            --output-file requirements.lock
          uv export --frozen --extra dev --no-emit-project --no-annotate \
            --output-file requirements-dev.lock
          git diff --exit-code -- uv.lock requirements.lock requirements-dev.lock

  # ── Ruff lint ─────────────────────────────────────────────────────────────
  # Zero violations required for the project-selected Ruff rule set.
  ruff-check:
    name: Ruff lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: install
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.lock

      - name: Install dependencies
        run: |
          python -m pip install --require-hashes -r requirements-dev.lock
          python -m pip install --no-deps -e .
          python -m pip check

      - name: Run ruff check
        run: ruff check app/ scripts/ tests/

  # ── Ruff format ───────────────────────────────────────────────────────────
  # Format check only — does not auto-format. Developers run `ruff format` locally.
  ruff-format:
    name: Ruff format check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: install
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.lock

      - name: Install dependencies
        run: |
          python -m pip install --require-hashes -r requirements-dev.lock
          python -m pip install --no-deps -e .
          python -m pip check

      - name: Run ruff format check
        run: ruff format --check app/ scripts/ tests/

  # ── Container contract ────────────────────────────────────────────────
  # Render both supported Compose modes and verify the shipped image's runtime user/directories.
  container-contract:
    name: Container contract
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: install
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Refuse missing PostgreSQL password
        run: |
          unset POSTGRES_PASSWORD
          if docker compose config --quiet; then
            echo "docker compose config succeeded without POSTGRES_PASSWORD" >&2
            exit 1
          fi

      - name: Prepare placeholder Compose environment
        run: cp .env.example .env

      - name: Render base and service-account Compose configurations
        env:
          POSTGRES_PASSWORD: ci-compose-only-password
          GOOGLE_SERVICE_ACCOUNT_HOST_FILE: .env.example
        run: |
          docker compose config --quiet
          docker compose -f docker-compose.yml \
            -f docker-compose.google-service-account.yml config --quiet

      - name: Build production image
        env:
          IMAGE_TAG: dream-motif-ci:${{ github.sha }}
        run: docker build --build-arg BUILD_SHA="${{ github.sha }}" --tag "$IMAGE_TAG" .

      - name: Verify non-root runtime and writable persistent paths
        env:
          IMAGE_TAG: dream-motif-ci:${{ github.sha }}
        run: |
          docker run --rm --entrypoint sh "$IMAGE_TAG" -eu -c '
            test "$(id -u)" -ne 0
            test -w /var/lib/dream-voice
            test -w /var/lib/dream-motif
            touch /var/lib/dream-voice/.ci-write-probe
            touch /var/lib/dream-motif/.ci-write-probe
          '

  # ── Pytest ────────────────────────────────────────────────────────────────
  # Runs unit and integration tests. Integration tests require PostgreSQL with pgvector.
  pytest:
    name: Pytest
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [ruff-check, ruff-format, container-contract]

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: dmi_test
          POSTGRES_PASSWORD: dmi_test
          POSTGRES_DB: dmi_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.lock

      - name: Install dependencies
        run: |
          python -m pip install --require-hashes -r requirements-dev.lock
          python -m pip install --no-deps -e .
          python -m pip check

      # ── Required env vars for tests ──────────────────────────────────────
      # Placeholder values only; CI never injects real credentials.
      - name: Run pytest
        env:
          DATABASE_URL: postgresql+asyncpg://dmi_test:dmi_test@localhost:5432/dmi_test
          TEST_DATABASE_URL: postgresql+asyncpg://dmi_test:dmi_test@localhost:5432/dmi_test
          REDIS_URL: redis://localhost:6379/0
          ANTHROPIC_API_KEY: test-anthropic-key
          OPENAI_API_KEY: test-openai-key
          GOOGLE_CLIENT_ID: test-client-id
          GOOGLE_CLIENT_SECRET: test-client-secret
          GOOGLE_REFRESH_TOKEN: test-google-refresh-token
          GOOGLE_DOC_ID: test-google-doc-id
          SECRET_KEY: test-secret-key-32-bytes-minimum-xx
          ENV: test
          BUILD_SHA: ${{ github.sha }}
          EMBEDDING_MODEL: text-embedding-3-small
          RETRIEVAL_THRESHOLD: "0.35"
          MAX_INDEX_AGE_HOURS: "24"
        run: pytest -q --tb=short tests/

      - name: Verify public privacy-safe retrieval and citation evidence
        run: >-
          python scripts/eval_public_fixture.py
          --check reports/evidence/portfolio-audit-2026-07-13/dream_motif_public_retrieval_v1.json

      - name: Run retrieval eval
        env:
          DATABASE_URL: postgresql+asyncpg://dmi_test:dmi_test@localhost:5432/dmi_test
          TEST_DATABASE_URL: postgresql+asyncpg://dmi_test:dmi_test@localhost:5432/dmi_test
          REDIS_URL: redis://localhost:6379/0
          ANTHROPIC_API_KEY: test-anthropic-key
          OPENAI_API_KEY: test-openai-key
          GOOGLE_CLIENT_ID: test-client-id
          GOOGLE_CLIENT_SECRET: test-client-secret
          GOOGLE_REFRESH_TOKEN: test-google-refresh-token
          GOOGLE_DOC_ID: test-google-doc-id
          SECRET_KEY: test-secret-key-32-bytes-minimum-xx
          ENV: test
          BUILD_SHA: ${{ github.sha }}
          EMBEDDING_MODEL: text-embedding-3-small
          RETRIEVAL_THRESHOLD: "0.35"
          MAX_INDEX_AGE_HOURS: "24"
        run: python scripts/eval.py --task-id CI --no-write-markdown --confirm-reset
