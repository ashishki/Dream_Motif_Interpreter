# Optional overlay for service-account authentication.
#
# The base stack intentionally has no credential-file bind mount, so it can be
# rendered and started with OAuth credentials (or with Google integration left
# unconfigured). Include this file only after GOOGLE_SERVICE_ACCOUNT_HOST_FILE
# points to an existing, protected JSON credential file on the host:
#
#   docker compose -f docker-compose.yml \
#     -f docker-compose.google-service-account.yml up --build -d

x-google-service-account: &google-service-account
  environment:
    GOOGLE_SERVICE_ACCOUNT_FILE: /run/secrets/google-service-account.json
  volumes:
    - type: bind
      source: ${GOOGLE_SERVICE_ACCOUNT_HOST_FILE:?Set GOOGLE_SERVICE_ACCOUNT_HOST_FILE to an existing JSON file}
      target: /run/secrets/google-service-account.json
      read_only: true

services:
  api:
    <<: *google-service-account

  telegram-bot:
    <<: *google-service-account

  auto-sync:
    <<: *google-service-account
