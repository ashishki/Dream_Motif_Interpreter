# CI — Dream Motif Interpreter
# Runs on every push and pull request.
# All steps are required to pass before a PR may be merged.

name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Install ──────────────────────────────────────────────────────────────
  # Install all production and dev dependencies from pinned requirement files.
  install:
    name: Install dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt -e .

  # ── Ruff lint ─────────────────────────────────────────────────────────────
  # Zero violations required. Ruff replaces flake8 + isort + pyupgrade.
  ruff-check:
    name: Ruff lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: install
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt -e .

      - name: Run ruff check
        run: ruff check app/ scripts/ tests/

  # ── Ruff format ───────────────────────────────────────────────────────────
  # Format check only — does not auto-format. Developers run `ruff format` locally.
  ruff-format:
    name: Ruff format check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: install
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt -e .

      - name: Run ruff format check
        run: ruff format --check app/ scripts/ tests/

  # ── Pytest ────────────────────────────────────────────────────────────────
  # Runs unit and integration tests. Integration tests require PostgreSQL with pgvector.
  pytest:
    name: Pytest
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [ruff-check, ruff-format]

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: dmi_test
          POSTGRES_PASSWORD: dmi_test
          POSTGRES_DB: dmi_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt -e .

      # ── Required env vars for tests ──────────────────────────────────────
      # Placeholder values only; CI never injects real credentials.
      - name: Run pytest
        env:
          DATABASE_URL: postgresql+asyncpg://dmi_test:dmi_test@localhost:5432/dmi_test
          TEST_DATABASE_URL: postgresql+asyncpg://dmi_test:dmi_test@localhost:5432/dmi_test
          REDIS_URL: redis://localhost:6379/0
          ANTHROPIC_API_KEY: test-anthropic-key
          OPENAI_API_KEY: test-openai-key
          GOOGLE_CLIENT_ID: test-client-id
          GOOGLE_CLIENT_SECRET: test-client-secret
          GOOGLE_REFRESH_TOKEN: test-google-refresh-token
          GOOGLE_DOC_ID: test-google-doc-id
          SECRET_KEY: test-secret-key-32-bytes-minimum-xx
          ENV: test
          EMBEDDING_MODEL: text-embedding-3-small
          RETRIEVAL_THRESHOLD: "0.35"
          MAX_INDEX_AGE_HOURS: "24"
        run: pytest -q --tb=short tests/

      - name: Verify public privacy-safe retrieval and citation evidence
        run: >-
          python scripts/eval_public_fixture.py
          --check reports/evidence/portfolio-audit-2026-07-13/dream_motif_public_retrieval_v1.json

      - name: Run retrieval eval
        env:
          DATABASE_URL: postgresql+asyncpg://dmi_test:dmi_test@localhost:5432/dmi_test
          TEST_DATABASE_URL: postgresql+asyncpg://dmi_test:dmi_test@localhost:5432/dmi_test
          REDIS_URL: redis://localhost:6379/0
          ANTHROPIC_API_KEY: test-anthropic-key
          OPENAI_API_KEY: test-openai-key
          GOOGLE_CLIENT_ID: test-client-id
          GOOGLE_CLIENT_SECRET: test-client-secret
          GOOGLE_REFRESH_TOKEN: test-google-refresh-token
          GOOGLE_DOC_ID: test-google-doc-id
          SECRET_KEY: test-secret-key-32-bytes-minimum-xx
          ENV: test
          EMBEDDING_MODEL: text-embedding-3-small
          RETRIEVAL_THRESHOLD: "0.35"
          MAX_INDEX_AGE_HOURS: "24"
        run: python scripts/eval.py --task-id CI --no-write-markdown
